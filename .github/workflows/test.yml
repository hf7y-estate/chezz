name: Test

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run check-syntax

      - run: npm run check-size

  playwright:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      # answer-channel.spec.mjs runs the production guard against GitHub
      # issues; gh intentionally refuses Actions jobs without this token.
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Restore Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npx playwright test --shard=${{ matrix.shard }}

  gate:
    if: always()
    needs: [preflight, playwright]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
        run: |
          test "$PREFLIGHT" = success
          test "$PLAYWRIGHT" = success

  # Not in gate's needs: it reads the live site, which no PR can change.
  live:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-live-deploy.mjs
        env:
          GH_TOKEN: ${{ github.token }}
