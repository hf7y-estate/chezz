name: Agent

# Parked 2026-10-01: by hand only. The nightly dispatch is moving to the
# estate's dexter containers (hf7y-estate/realisateur agent/); see
# DESIGN-NOTES.md "Dispatch and checks".
on:
  workflow_dispatch:

concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: "chezz#36: fail now if Actions still may not open a PR, before a run is spent"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          perms=$(gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow") || {
            echo "::warning::Could not read the actions/permissions/workflow setting -- GITHUB_TOKEN has no administration scope for this endpoint (chezz#74), so this can't distinguish 'disabled' from 'can't check'. Proceeding; a real PR-create failure later will still surface."
            exit 0
          }
          echo "$perms"
          echo "$perms" | grep -q '"can_approve_pull_request_reviews": *true' || {
            echo "::error::Actions cannot create pull requests here. Settings -> Actions -> General -> Workflow permissions. On 2026-08-16 this stranded a night of work on unmerged branches."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: "Work the backlog on the estate's OAuth token, not a repo API key (chezz#41 deleted this runner for a dead ANTHROPIC_API_KEY)"
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >-
            /nightly-batch

            Fully unattended, no human review step. The open GitHub issues on
            hf7y-estate/chezz are the backlog and the scoping authority; work the
            answered ones first (a non-agent-stamped comment from `hf7y` IS
            the answer, whatever the labels or state say).

            Before starting an issue, check that no open PR and no recent
            branch already covers it, and pick another if one does.

            Once `npm run check` passes and you have committed, push a
            uniquely named branch and open a pull request into main, then run
            `gh pr merge --auto --squash`. Do not push to main -- it is
            protected and requires the `gate` check. Never resolve or
            reclassify anything you are not confident about; leave it open
            with a note instead.
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
            --max-turns 120

      - name: "chezz#67: kick required checks for any PR this run opened -- GITHUB_TOKEN doesn't auto-trigger pull_request events"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open \
            --json headRefName,headRefOid --jq '.[] | @base64' | while read -r row; do
            branch=$(echo "$row" | base64 -d | jq -r .headRefName)
            sha=$(echo "$row" | base64 -d | jq -r .headRefOid)
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --jq '.total_count')
            if [ "$runs" = "0" ]; then
              echo "No check runs on $branch@$sha -- dispatching test.yml so gate/preflight can report"
              gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            else
              echo "$branch@$sha already has $runs check run(s), leaving it alone"
            fi
          done
